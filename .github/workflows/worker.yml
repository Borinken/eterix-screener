name: Screener worker (manual)

# Manual trigger only.
#
# This ran on a 5-minute schedule and failed every time. `gmgn-cli config
# --apply` needs the keypair generated during registration by `gmgn-cli
# config`; a fresh runner has no keypair, so applying the key aborts with
# "keypair.pem not found". Generating a new keypair per run does not help —
# it would not match the one the API key is registered against.
#
# The credential model assumes a host that keeps state between calls, which
# is also what the architecture calls for: the worker is a long-running
# process on Railway, Docker or a VPS, holding the queue open and pacing
# itself against the upstream rate limit. A cron that re-installs the CLI
# every five minutes was working against that design, not implementing it.
#
# Kept as workflow_dispatch so the queue can still be drained on demand from
# a runner that has been configured manually.

on:
  workflow_dispatch:

jobs:
  drain-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g gmgn-cli

      - name: Apply isolated GMGN config
        run: |
          mkdir -p "$RUNNER_TEMP/gmgn-home"
          HOME="$RUNNER_TEMP/gmgn-home" gmgn-cli config --apply "${{ secrets.GMGN_API_KEY }}"

      - run: pip install -r worker/requirements.txt

      - name: Drain pending scan queue
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMGN_ISOLATED_HOME: ${{ runner.temp }}/gmgn-home
        run: python screener_worker.py --once
